# Yui default hypridle config (override with ~/.config/hypr/hypridle.conf)
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hypridle

general {
    lock_cmd = yui-lock               # Yui Shell lock screen
    before_sleep_cmd = loginctl lock-session                          # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # turn on screen w/o key press after resume.
}

listener {
    timeout = 150                                # 2.5min.
    on-timeout = yui-brightness -s set 10%         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = yui-brightness -r                 # monitor backlight restore.
}

listener {
    timeout = 300                                 # 5min.
    on-timeout = loginctl lock-session            # lock screen when timeout has passed.
}

listener {
    timeout = 330                                                 # 5.5min.
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})' # screen off when timeout has passed.
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'   # screen on when activity is detected.
}

listener {
    timeout = 1800                                # 30min.
    on-timeout = systemctl suspend                # suspend pc.
}
